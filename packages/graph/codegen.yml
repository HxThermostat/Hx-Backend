overwrite: true
schema: "schema/**/*.graphql"
generates:
  ./src/schema/resolvers-types.ts:
    plugins:
      - "typescript"
      - "typescript-resolvers"
    config:
      contextType: ./context#AppContext
      mappers:
        User: ./mappers#UserMapper
        Location: ./mappers#LocationMapper
        Controller: ./mappers#DeviceMapper
        Share: ./mappers#ShareMapper
        PushToken: ./mappers#PushTokenMapper
      useIndexSignature: true
    hooks:
      afterOneFileWrite:
        - yarn prettier --write
  ./src/graphql.schema.json:
    plugins:
      - "introspection"
    hooks:
      afterOneFileWrite:
        - yarn prettier --write
  ./src/server/actions_on_google/graph/operations-types.ts:
    documents:
      - "./src/server/actions_on_google/**/*.graphql"
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typed-document-node"
    config:
      avoidOptionals: true
      maybeValue: T | undefined
      skipTypename: true
    hooks:
      afterOneFileWrite:
        - yarn prettier --write
  ./src/server/oauth/graph/operations-types.ts:
    documents:
      - "./src/server/oauth/**/*.graphql"
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typed-document-node"
    config:
      avoidOptionals: true
      maybeValue: T | undefined
      skipTypename: true
    hooks:
      afterOneFileWrite:
        - yarn prettier --write
