    <!-- Place favicon.ico in the root directory -->

      crossorigin="anonymous"

    <meta name="theme-color" content="#fafafa" />

    <style>
      html {
        background: #181718;
        background: linear-gradient(to bottom, #181718, #1d1e1e);
        background-attachment: scroll;
        background-repeat: no-repeat;
        background-size: cover;
        min-height: 100vh;

        justify-content: center;
        display: flex;
      }

      body {
        display: flex;
        flex-direction: column;
        align-self: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        margin: auto;
      }

      p {
        font-weight: 200;
        font-size: 13px;
        line-height: 22px;
        /* identical to box height, or 169% */
        text-align: center;
        letter-spacing: -0.408px;

        /* Font */
        color: #ffffff;

        opacity: 0.5;

        width: 150px;

        margin: 15px auto;
      }

      svg {
        margin: 50px 0;
      }

      form {
        display: flex;
        align-items: center;
        flex-direction: column;
        max-width: 376px;
        margin: auto;
      }

      legend {
        border: none;
        color: #fff;
        font-size: 34px;
        line-height: 41px;
        margin-bottom: 43px;
        text-align: center;
      }

      ::placeholder {
        /* Chrome, Firefox, Opera, Safari 10.1+ */
        color: rgba(235, 235, 245, 0.3);
        opacity: 1; /* Firefox */
      }

      button {
        display: block;
        background-color: transparent;
        border: 1px solid #ffffff;
        border-radius: 25px;
        color: #fff;
        line-height: 20px;
        padding: 15px 0;
        font-size: 18px;
        width: 150px;
        margin: 100px auto 0;
      }

      fieldset {
        border: none;
        padding: 0 68px;
      }

      input[type="email"],
      input[type="text"] {
        border: 1px solid #ffffff;
        border-radius: 5px;
        box-shadow: none;
        background-color: transparent;
        color: #fff;
        padding: 10px 8px;
        width: 100%;
      }
    </style>
  </head>
